# Edge rate limit for the auth endpoints. limit_req_zone is only valid in the
# http context, so it lives above the server block (this file is envsubst'ed
# into /etc/nginx/conf.d/default.conf, which nginx includes inside http).
# The zone is a shared-memory leaky bucket keyed by client IP: 10r/m admits
# one request per 6s per IP; the location block allows short bursts of 5.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust Google's front-end / IAP proxies so $binary_remote_addr resolves
    # to the real client IP instead of the proxy IP. Without this, all
    # operators would share one rate-limit bucket. real_ip_recursive walks
    # the X-Forwarded-For chain right-to-left past trusted proxies and stops
    # at the first untrusted address — the genuine client. In kind/local
    # there is no proxy and no XFF, so these directives are a no-op.
    set_real_ip_from 130.211.0.0/22;
    set_real_ip_from 35.191.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/xml+rss application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Auth must be matched before the broader Sales API prefix. The ^~
    # modifier keeps API paths ending in static file extensions (such as
    # image upload URLs) from being captured by the static assets regex.
    location ^~ /v1/auth/ {
        # Requests beyond the zone rate are queued up to the burst size and
        # delayed; anything past that is rejected with 429 before any Go
        # handler or bcrypt comparison runs.
        limit_req zone=auth_login burst=5;
        limit_req_status 429;

        proxy_pass ${AUTH_API_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/ {
        # Slightly above the API's 5 MiB image limit so oversize uploads get
        # the API's validation error instead of an opaque nginx 413.
        client_max_body_size 6m;
        proxy_pass ${SALES_API_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
