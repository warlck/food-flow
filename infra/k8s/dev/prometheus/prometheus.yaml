apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sales-system
data:
  prometheus.yml: |-
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'sales'
        static_configs:
          - targets: ['sales-service:3010']
      - job_name: 'auth'
        static_configs:
          - targets: ['auth-service:6010']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sales-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: sales-system
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
