name: Food Flow CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Backend Tests
        run: go test -count=1 ./...

  test-frontend:
    name: Test & Build Frontend Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/frontends/food-flow-online-hub/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: api/frontends/food-flow-online-hub
        run: npm ci

      - name: Run Frontend Linter
        working-directory: api/frontends/food-flow-online-hub
        run: npm run lint

      - name: Build Frontend Application
        working-directory: api/frontends/food-flow-online-hub
        run: npm run build

  deploy-staging:
    name: Deploy to GCP Staging
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy Services to GCP Staging
        run: ./infra/gcp/deploy-staging.sh
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'project-da1b7a1f-5ac7-474f-a6c' }}
          GCP_REGION: ${{ secrets.GCP_REGION || 'asia-southeast1' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
